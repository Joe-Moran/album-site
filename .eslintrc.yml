root: true
env:
  es6: true
  node: true
  jest: true
globals:
  vi: readonly
rules:
  'linebreak-style': 0
  'vue/multi-word-component-names': 'warn'
  'vue/no-reserved-component-names': 'warn'
  'vue/html-button-has-type': 'warn'
  'vuejs-accessibility/alt-text': 'warn'
  'vuejs-accessibility/click-events-have-key-events': 'warn'
  'vuejs-accessibility/iframe-has-title': 'warn'
  'import/no-unresolved':
    - 'error'
    - ignore: ['^@?storybook', '^@vitejs/', '\?url$']
  'import/no-extraneous-dependencies':
    - 'error'
    - devDependencies:
        - '**/*.test.js'
        - '**/integration/**'
        - '**/e2e/**'
        - '**/*.e2e.js'
        - '**/*.integration.js'
        - '**/*.stories.js'
        - '**/*.config.js'
        - '**/*.config.mjs'
        - '.storybook/**'
        - 'vitest.setup.js'
  'vue/order-in-components':
    - 'error'
    - order:
      - 'name'
      - ["delimiters", "comments"]
      - ["components", "directives"]
      - 'extends'
      - 'mixins'
      - 'ROUTER_GUARDS'
      - 'model'
      - ["props", "propsData"]
      - 'data'
      - 'computed'
      - 'watch'
      - 'methods'
      - 'LIFECYCLE_HOOKS'
      - ["template", "render", "filters"]
      - 'renderError'
extends:
  - 'plugin:vue/vue3-recommended'
  - '@vue/airbnb'
  - 'plugin:jest-dom/recommended'
overrides:
  - files:
      - '**/__tests__/*.{j,t}s?(x)'
      - '**/tests/unit/**/*.spec.{j,t}s?(x)'
    env:
      jest: true
settings:
  import/resolver:
    node: {}
    custom-alias:
      alias:
        '@': './src'
      extensions: ['.mjs', '.js', '.vue', '.json']
